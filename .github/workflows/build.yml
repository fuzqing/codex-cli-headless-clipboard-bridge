name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l (git ls-files '*.go')
          if ($unformatted) { throw "Run gofmt on: $unformatted" }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout 2m -v ./...
      - name: Build and package Windows amd64
        run: ./scripts/package.ps1
      - name: Upload compiled files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipbridge-windows-amd64
          path: |
            dist/release/clipbridge.exe
            dist/release/clipbridge-windows-amd64.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
