name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [VERSION]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout 2m -v ./...
      - name: Build and package Windows amd64
        run: ./scripts/package.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $env:GITHUB_REF_NAME
          } else {
              (Get-Content -LiteralPath VERSION -Raw).Trim()
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw 'Expected a version tag such as v0.1.0-alpha.1 or v1.0.0'
          }
          $releaseArgs = @(
              'release', 'create', $tag,
              'dist/release/clipbridge.exe',
              'dist/release/clipbridge-windows-amd64.zip',
              'dist/release/SHA256SUMS.txt',
              '--repo', $env:GITHUB_REPOSITORY,
              '--generate-notes',
              '--title', "Clipbridge $tag"
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $releaseArgs += '--verify-tag'
          } else {
              $releaseArgs += @('--target', $env:GITHUB_SHA)
          }
          if ($tag.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
